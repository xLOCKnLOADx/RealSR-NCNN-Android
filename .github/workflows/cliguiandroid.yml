name: Build RealSR Full (CLI + GUI)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: 26.1.10909125

    steps:
      # Checkout repo + all submodules (ncnn, etc.)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Install native build tools
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build unzip

      # Setup Java
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Install NDK
      - name: Install NDK
        run: |
          sdkmanager "ndk;$ANDROID_NDK_VERSION"

      # Verify models are real files, not LFS pointers
      - name: Verify models
        run: |
          file RealSR-NCNN-Android-CLI/models/**/*.bin | grep -v "ASCII\|pointer" || \
            (echo "❌ LFS placeholders detected — commit real model files!" && exit 1)

      # Build CLI
      - name: Build CLI
        run: |
          cd RealSR-NCNN-Android-CLI
          mkdir build && cd build

          cmake .. \
            -G Ninja \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake

          ninja

      # Copy only the binary + models into GUI assets
      - name: Prepare assets
        run: |
          mkdir -p RealSR-NCNN-Android-GUI/app/src/main/assets

          # CLI binary only (not the whole build dir)
          cp RealSR-NCNN-Android-CLI/build/realsr-ncnn \
            RealSR-NCNN-Android-GUI/app/src/main/assets/

          # Models
          cp -r RealSR-NCNN-Android-CLI/models \
            RealSR-NCNN-Android-GUI/app/src/main/assets/

      # Debug: confirm asset structure before building
      - name: Verify asset structure
        run: |
          echo "=== Assets ==="
          ls -la RealSR-NCNN-Android-GUI/app/src/main/assets/
          echo "=== Models ==="
          ls -la RealSR-NCNN-Android-GUI/app/src/main/assets/models/

      # Cache Gradle dependencies
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Build APK
      - name: Build APK
        run: |
          cd RealSR-NCNN-Android-GUI
          chmod +x gradlew
          ./gradlew assembleDebug

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealSR-Full-APK
          path: RealSR-NCNN-Android-GUI/app/build/outputs/apk/debug/*.apk
