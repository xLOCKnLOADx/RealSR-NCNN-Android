name: Build RealSR Full (CLI + GUI)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: 26.1.10909125
      NCNN_URL: https://github.com/Tencent/ncnn/releases/download/20250503/ncnn-20250503-android-vulkan-shared.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build unzip wget

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;$ANDROID_NDK_VERSION"

      - name: Clone 3rdparty dependencies
        run: |
          mkdir -p 3rdparty

          echo "=== Cloning libwebp ==="
          git clone --depth 1 https://github.com/webmproject/libwebp \
            3rdparty/libwebp

          echo "=== Cloning MNN ==="
          git clone --depth 1 \
            https://github.com/alibaba/MNN.git \
            3rdparty/mnn

          echo "=== Downloading prebuilt ncnn Android ==="
          wget -q $NCNN_URL -O ncnn-android-vulkan-shared.zip
          unzip -q ncnn-android-vulkan-shared.zip -d 3rdparty/ncnn-android-vulkan-shared

          echo "=== Downloading OpenCV Android SDK ==="
          wget -q https://github.com/opencv/opencv/releases/download/4.8.0/opencv-4.8.0-android-sdk.zip
          unzip -q opencv-4.8.0-android-sdk.zip
          mv OpenCV-android-sdk 3rdparty/opencv

          echo "=== Locating OpenCVConfig.cmake ==="
          find 3rdparty/opencv -name "OpenCVConfig.cmake"

          echo "=== 3rdparty contents ==="
          ls -la 3rdparty/

      - name: Verify models
        run: |
          echo "=== Checking model files ==="
          find RealSR-NCNN-Android-CLI/assets -name "*.bin" -o -name "*.param" | head -20
          find RealSR-NCNN-Android-CLI/assets -name "*.bin" | while read f; do
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -lt 1024 ]; then
              echo "❌ Possible LFS pointer: $f ($SIZE bytes)"
              exit 1
            fi
          done
          echo "✅ Models look real"

      - name: Build CLI (all engines)
        run: |
          NDK_TOOLCHAIN=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake
          OPENCV_DIR=$GITHUB_WORKSPACE/3rdparty/opencv/sdk/native/jni/abi-arm64-v8a
          NCNN_DIR=$GITHUB_WORKSPACE/3rdparty/ncnn-android-vulkan-shared/arm64-v8a/lib/cmake/ncnn

          for ENGINE in RealSR Waifu2x SRMD RealCUGAN Anime4k Resize MNN-SR; do
            JNI_PATH="RealSR-NCNN-Android-CLI/$ENGINE/src/main/jni"
            if [ -f "$JNI_PATH/CMakeLists.txt" ]; then
              echo "=== Building $ENGINE ==="
              mkdir -p "$JNI_PATH/build"
              cd "$JNI_PATH/build"
              cmake .. \
                -G Ninja \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 \
                -DCMAKE_TOOLCHAIN_FILE=$NDK_TOOLCHAIN \
                -DOpenCV_DIR=$OPENCV_DIR \
                -Dncnn_DIR=$NCNN_DIR
              ninja
              cd $GITHUB_WORKSPACE
            else
              echo "=== Skipping $ENGINE (no CMakeLists.txt) ==="
            fi
          done

      - name: Prepare assets
        run: |
          mkdir -p RealSR-NCNN-Android-GUI/app/src/main/assets

          for ENGINE in RealSR Waifu2x SRMD RealCUGAN Anime4k Resize MNN-SR; do
            BUILD_PATH="RealSR-NCNN-Android-CLI/$ENGINE/src/main/jni/build"
            if [ -d "$BUILD_PATH" ]; then
              echo "=== Copying binaries from $ENGINE ==="
              find "$BUILD_PATH" -maxdepth 1 -type f \
                ! -name "*.cmake" \
                ! -name "*.ninja" \
                ! -name "*.txt" \
                ! -name "Makefile" \
                -exec cp {} RealSR-NCNN-Android-GUI/app/src/main/assets/ \;
            fi
          done

          echo "=== Copying models ==="
          cp -r RealSR-NCNN-Android-CLI/assets/. \
            RealSR-NCNN-Android-GUI/app/src/main/assets/

      - name: Verify asset structure
        run: |
          echo "=== Assets root ==="
          ls -la RealSR-NCNN-Android-GUI/app/src/main/assets/
          echo "=== Model folders ==="
          ls -la RealSR-NCNN-Android-GUI/app/src/main/assets/*/ 2>/dev/null || echo "No subfolders"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build APK
        run: |
          cd RealSR-NCNN-Android-GUI
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealSR-Full-APK
          path: RealSR-NCNN-Android-GUI/app/build/outputs/apk/debug/*.apk
